name: Claude

# Comment "@claude ..." on a pull request or issue to run Claude.
# Example: "@claude review this PR for bugs and security issues"
on:
  issue_comment:
    types: [created]
  pull_request_review_comment:
    types: [created]

jobs:
  claude:
    if: contains(github.event.comment.body, '@claude')
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
      pull-requests: write
      issues: write
      id-token: write
      actions: read
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 1
      - uses: anthropics/claude-code-action@v1
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          # Sonnet keeps reviews cheaper than the default model.
          # Swap to claude-haiku-5-5 for even lower usage.
          claude_args: "--model claude-sonnet-5-5 --max-turns 10"

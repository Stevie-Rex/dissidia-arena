name: Tests

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

# A new push to the same PR or branch cancels the run it replaces.
concurrency:
  group: tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend (pytest)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - run: pip install -r requirements.txt
      # tests/conftest.py supplies a test SECRET_KEY and an in-memory SQLite database,
      # so no secrets, MariaDB or Discord are needed.
      - run: python -m pytest -q
      # The migrations build the schema the models describe: no missing or stray changes.
      - name: Migrations match the models
        env:
          SECRET_KEY: ci
          DATABASE_URL: sqlite:///${{ runner.temp }}/migrations.db
          FLASK_APP: run.py
        run: flask db upgrade && flask db check

  frontend:
    name: Frontend (lint, build, browser tests)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run lint
      # Colours come from the theme's tokens, never hex values in components.
      - name: No hex colours in components
        run: |
          ! grep -rnE --include='*.tsx' "[\"'\` :[]#([0-9a-fA-F]{3,4}|[0-9a-fA-F]{6}|[0-9a-fA-F]{8})\b" src
      # tsc -b then vite build, so this is also the type check.
      - run: npm run build
      - run: npx playwright install --with-deps chromium
      # Every /api call is mocked in the tests, so this needs only the Vite dev server.
      - run: npm run test:e2e
      - if: failure()
        uses: actions/upload-artifact@v5
        with:
          name: playwright-results
          path: frontend/test-results/
          retention-days: 7

name: Claude (Opus)

# Comment "@claude-opus ..." on a pull request or issue to run Claude on Opus.
# Use for risky or important PRs; everyday work uses "@claude" (Sonnet).
# Example: "@claude-opus review this PR carefully for bugs and security issues"
on:
  issue_comment:
    types: [created]
  pull_request_review_comment:
    types: [created]

jobs:
  claude-opus:
    if: contains(github.event.comment.body, '@claude-opus')
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: write
      pull-requests: write
      issues: write
      id-token: write
      actions: read
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 1
      - uses: anthropics/claude-code-action@v1
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          trigger_phrase: "@claude-opus"
          claude_args: "--model claude-opus-5-5 --max-turns 15"
